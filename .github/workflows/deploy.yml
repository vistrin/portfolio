name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish; skip any queued in between.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build shared and data-driven page sections
        run: python3 build.py

      - name: Set last updated date
        run: |
          DATE=$(date +'%B %Y')
          sed -i "s|LAST_UPDATED_PLACEHOLDER|$DATE|g" *.html

      - name: Collect site files
        run: |
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github' --exclude '.vscode' \
            --exclude '.githooks' --exclude '_partials' --exclude 'data' --exclude 'build.py' --exclude '_site'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
