<svg viewBox="0 0 800 340" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prf-t prf-d">
  <title id="prf-t">Scenario object model with lineage and feedback</title>
  <desc id="prf-d">A model, a set of parameters, and input data feed a run. Each run produces an output set of scenarios, up to hundreds per run. An analyst selects a scenario, which a person may then adjust. Every scenario records its lineage: which data, which parameters, which model. The recommended scenario plus actual results feed back in as the next period's input data.</desc>
  <defs><marker id="ah3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4A6FA5"/></marker></defs>

  <rect x="10" y="34" width="170" height="56" rx="5" fill="#4A6FA5"/>
  <text x="95" y="58" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Model</text>
  <text x="95" y="76" text-anchor="middle" fill="#F4F7FB" font-size="10">machine-learning model</text>
  <rect x="10" y="114" width="170" height="56" rx="5" fill="#4A6FA5"/>
  <text x="95" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Parameters</text>
  <text x="95" y="156" text-anchor="middle" fill="#F4F7FB" font-size="10">boundaries on what comes back</text>
  <rect x="10" y="194" width="170" height="56" rx="5" fill="#4A6FA5"/>
  <text x="95" y="218" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Input data</text>
  <text x="95" y="236" text-anchor="middle" fill="#F4F7FB" font-size="10">the data the model runs on</text>

  <line x1="180" y1="62" x2="248" y2="126" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="180" y1="142" x2="248" y2="142" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="180" y1="222" x2="248" y2="158" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>

  <rect x="250" y="104" width="110" height="76" rx="5" fill="#EAF0F8" stroke="#4A6FA5"/>
  <text x="305" y="136" text-anchor="middle" fill="#2A4A7A" font-size="13" font-weight="600">Run</text>
  <text x="305" y="154" text-anchor="middle" fill="#3D5F94" font-size="10">one combination</text>
  <text x="305" y="168" text-anchor="middle" fill="#3D5F94" font-size="10">of the three</text>
  <line x1="360" y1="142" x2="418" y2="142" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>

  <rect x="420" y="104" width="140" height="76" rx="5" fill="#4A6FA5"/>
  <text x="490" y="134" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Output</text>
  <text x="490" y="152" text-anchor="middle" fill="#F4F7FB" font-size="10">scenario set,</text>
  <text x="490" y="166" text-anchor="middle" fill="#F4F7FB" font-size="10">up to hundreds per run</text>

  <line x1="560" y1="124" x2="618" y2="72" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>
  <rect x="620" y="34" width="170" height="56" rx="5" fill="#EAF0F8" stroke="#4A6FA5"/>
  <text x="705" y="58" text-anchor="middle" fill="#2A4A7A" font-size="12" font-weight="600">Selected scenario</text>
  <text x="705" y="76" text-anchor="middle" fill="#3D5F94" font-size="10">chosen by the analyst</text>
  <line x1="705" y1="90" x2="705" y2="131" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>
  <rect x="620" y="134" width="170" height="64" rx="5" fill="#EAF0F8" stroke="#4A6FA5"/>
  <text x="705" y="155" text-anchor="middle" fill="#2A4A7A" font-size="12" font-weight="600">Adjusted scenario</text>
  <text x="705" y="171" text-anchor="middle" fill="#3D5F94" font-size="10">generated by the model,</text>
  <text x="705" y="185" text-anchor="middle" fill="#3D5F94" font-size="10">then edited by a person</text>

  <line x1="490" y1="180" x2="490" y2="212" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="250" y="214" width="310" height="50" rx="4" fill="none" stroke="#888" stroke-dasharray="4 3"/>
  <text x="405" y="235" text-anchor="middle" fill="#333" font-size="11" font-weight="600">Every scenario records its lineage:</text>
  <text x="405" y="252" text-anchor="middle" fill="#555" font-size="10.5">which data · which parameters · which model</text>

  <path d="M705,198 L705,298 L95,298 L95,254" fill="none" stroke="#4A6FA5" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah3)"/>
  <text x="400" y="320" text-anchor="middle" fill="#444" font-size="10.5">The recommended scenario plus actual results become the next period’s input data.</text>
</svg>
