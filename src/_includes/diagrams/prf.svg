<svg viewBox="0 0 800 280" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="prf-t prf-d">
  <title id="prf-t">What a forecasting scenario is made of</title>
  <desc id="prf-d">A model, parameters that set boundaries on what comes back, and input data feed a run. Each run produces a scenario set of around a hundred scenarios, each spanning 90+ product lines over up to ten years. Users filter and sort the scenarios by criteria, then compare them side by side. Every result traces to the data, parameters, and model that produced it.</desc>
  <defs><marker id="ah3" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4A6FA5"/></marker></defs>

  <rect x="10" y="34" width="170" height="56" rx="5" fill="#4A6FA5"/>
  <text x="95" y="58" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Model</text>
  <text x="95" y="76" text-anchor="middle" fill="#F4F7FB" font-size="10">machine-learning model</text>
  <rect x="10" y="114" width="170" height="56" rx="5" fill="#4A6FA5"/>
  <text x="95" y="138" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Parameters</text>
  <text x="95" y="156" text-anchor="middle" fill="#F4F7FB" font-size="10">boundaries on what comes back</text>
  <rect x="10" y="194" width="170" height="56" rx="5" fill="#4A6FA5"/>
  <text x="95" y="218" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Input data</text>
  <text x="95" y="236" text-anchor="middle" fill="#F4F7FB" font-size="10">the data the model runs on</text>

  <line x1="180" y1="62" x2="248" y2="126" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="180" y1="142" x2="248" y2="142" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="180" y1="222" x2="248" y2="158" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>

  <rect x="250" y="104" width="110" height="76" rx="5" fill="#EAF0F8" stroke="#4A6FA5"/>
  <text x="305" y="146" text-anchor="middle" fill="#2A4A7A" font-size="13" font-weight="600">Run</text>
  <line x1="360" y1="142" x2="418" y2="142" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>

  <rect x="420" y="98" width="140" height="88" rx="5" fill="#4A6FA5"/>
  <text x="490" y="122" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Scenario set</text>
  <text x="490" y="140" text-anchor="middle" fill="#F4F7FB" font-size="10">around a hundred, each</text>
  <text x="490" y="154" text-anchor="middle" fill="#F4F7FB" font-size="10">spanning 90+ product lines</text>
  <text x="490" y="168" text-anchor="middle" fill="#F4F7FB" font-size="10">over up to ten years</text>

  <line x1="560" y1="124" x2="618" y2="72" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>
  <rect x="620" y="34" width="170" height="56" rx="5" fill="#EAF0F8" stroke="#4A6FA5"/>
  <text x="705" y="58" text-anchor="middle" fill="#2A4A7A" font-size="12" font-weight="600">Filter &amp; sort</text>
  <text x="705" y="76" text-anchor="middle" fill="#3D5F94" font-size="10">by criteria</text>
  <line x1="705" y1="90" x2="705" y2="131" stroke="#4A6FA5" stroke-width="1.5" marker-end="url(#ah3)"/>
  <rect x="620" y="134" width="170" height="56" rx="5" fill="#EAF0F8" stroke="#4A6FA5"/>
  <text x="705" y="158" text-anchor="middle" fill="#2A4A7A" font-size="12" font-weight="600">Compare</text>
  <text x="705" y="176" text-anchor="middle" fill="#3D5F94" font-size="10">side by side</text>

  <line x1="490" y1="186" x2="490" y2="212" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="250" y="214" width="310" height="50" rx="4" fill="none" stroke="#888" stroke-dasharray="4 3"/>
  <text x="405" y="235" text-anchor="middle" fill="#333" font-size="11" font-weight="600">Every result traces to the data,</text>
  <text x="405" y="252" text-anchor="middle" fill="#555" font-size="10.5">parameters, and model that produced it.</text>
</svg>
