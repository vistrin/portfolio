<svg viewBox="0 0 800 345" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dso-t dso-d">
  <title id="dso-t">Staged deployment pipeline with two review gates</title>
  <desc id="dso-d">Code moves from Dev through Gate 1 review to Test, then through Gate 2 final review to Prod. Gate 1 requires a security scan, architecture diagrams, access permissions, and documented dependencies. Gate 2 requires a backout plan, UAT sign-off, and end-user help documentation. A project record captured once sits beneath the pipeline and is read by every gate. Approval at each gate unlocks the next environment.</desc>
  <defs><marker id="ah2" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4A6FA5"/></marker></defs>

  <rect x="20" y="50" width="140" height="52" rx="5" fill="#4A6FA5"/>
  <text x="90" y="73" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">DEV</text>
  <text x="90" y="91" text-anchor="middle" fill="#F4F7FB" font-size="10">environment</text>
  <line x1="160" y1="76" x2="200" y2="76" stroke="#4A6FA5" stroke-width="2" marker-end="url(#ah2)"/>

  <rect x="200" y="40" width="120" height="72" rx="4" fill="#EAF0F8" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="260" y="68" text-anchor="middle" fill="#2A4A7A" font-size="11" font-weight="600">Review Board</text>
  <text x="260" y="84" text-anchor="middle" fill="#3D5F94" font-size="10">Gate 1</text>
  <text x="260" y="100" text-anchor="middle" fill="#666" font-size="9">Dev → Test</text>
  <line x1="320" y1="76" x2="360" y2="76" stroke="#4A6FA5" stroke-width="2" marker-end="url(#ah2)"/>

  <rect x="360" y="50" width="140" height="52" rx="5" fill="#4A6FA5"/>
  <text x="430" y="73" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">TEST</text>
  <text x="430" y="91" text-anchor="middle" fill="#F4F7FB" font-size="10">environment</text>
  <line x1="500" y1="76" x2="540" y2="76" stroke="#4A6FA5" stroke-width="2" marker-end="url(#ah2)"/>

  <rect x="540" y="40" width="120" height="72" rx="4" fill="#EAF0F8" stroke="#4A6FA5" stroke-width="1.5"/>
  <text x="600" y="68" text-anchor="middle" fill="#2A4A7A" font-size="11" font-weight="600">Review Board</text>
  <text x="600" y="84" text-anchor="middle" fill="#3D5F94" font-size="10">Gate 2 (Final)</text>
  <text x="600" y="100" text-anchor="middle" fill="#666" font-size="9">Test → Prod</text>
  <line x1="660" y1="76" x2="700" y2="76" stroke="#4A6FA5" stroke-width="2" marker-end="url(#ah2)"/>

  <rect x="700" y="50" width="80" height="52" rx="5" fill="#4A6FA5"/>
  <text x="740" y="73" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">PROD</text>
  <text x="740" y="91" text-anchor="middle" fill="#F4F7FB" font-size="10">live</text>

  <line x1="260" y1="112" x2="260" y2="148" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="170" y="148" width="180" height="100" rx="4" fill="#F7F7F5" stroke="#CFCFCB"/>
  <text x="260" y="168" text-anchor="middle" fill="#333" font-size="10" font-weight="600">Required for Gate 1</text>
  <g text-anchor="middle" font-size="10" fill="#555">
    <text x="260" y="186">· Security scan</text>
    <text x="260" y="202">· Architecture diagrams</text>
    <text x="260" y="218">· Access permissions</text>
    <text x="260" y="234">· Dependencies documented</text>
  </g>

  <line x1="600" y1="112" x2="600" y2="148" stroke="#888" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="510" y="148" width="180" height="100" rx="4" fill="#F7F7F5" stroke="#CFCFCB"/>
  <text x="600" y="168" text-anchor="middle" fill="#333" font-size="10" font-weight="600">Required for Gate 2</text>
  <g text-anchor="middle" font-size="10" fill="#555">
    <text x="600" y="186">· Backout plan</text>
    <text x="600" y="202">· UAT sign-off</text>
    <text x="600" y="218">· End-user help documentation</text>
  </g>

  <rect x="20" y="268" width="760" height="44" rx="5" fill="#EAF0F8" stroke="#4A6FA5"/>
  <text x="400" y="295" text-anchor="middle" fill="#2A4A7A" font-size="12" font-weight="600">Project record: captured once, read by every gate</text>
  <text x="400" y="334" text-anchor="middle" fill="#666" font-size="10.5" font-style="italic">Approval at each gate unlocks the next environment.</text>
</svg>
